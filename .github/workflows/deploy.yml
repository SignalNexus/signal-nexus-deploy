# Calls the public core reusable workflow.
# This file does not name a customer, a host, or a machine.
# The uses ref and core_sha are the commit in core-pin.

name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      strategies_blob: ${{ steps.pin.outputs.strategies_blob }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the core pin
        id: pin
        run: |
          pin="$(tr -d '[:space:]' < core-pin)"
          if [[ ! "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "core-pin must be 40 hex characters" >&2
            exit 1
          fi
          if [[ "$pin" == 0000000000000000000000000000000000000000 ]]; then
            echo "core-pin is still the placeholder" >&2
            exit 1
          fi
          if ! grep -Fq "$pin" .github/workflows/deploy.yml; then
            echo "deploy.yml does not use the core-pin commit" >&2
            exit 1
          fi
          if [[ ! -s config/strategies.yml ]]; then
            echo "config/strategies.yml is missing" >&2
            exit 1
          fi
          echo "strategies_blob=$(git hash-object config/strategies.yml)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pin
    if: vars.DEPLOY_ANALYTICS == 'true'
    uses: SignalNexus/signal-nexus/.github/workflows/analytics-deploy.yml@6468be5be0869203b05ee6e1d134878b3cce6c68
    with:
      core_repository: SignalNexus/signal-nexus
      core_sha: 6468be5be0869203b05ee6e1d134878b3cce6c68
      expected_strategies_blob: ${{ needs.pin.outputs.strategies_blob }}
      venues_manifest: venueadd/venues.yaml
      ssh_user: ${{ vars.ANALYTICS_SSH_USER }}
      core_directory: ${{ vars.ANALYTICS_CORE_DIRECTORY }}
      venue_directory: ${{ vars.ANALYTICS_VENUE_DIRECTORY }}
      builtin_venues: ${{ vars.BUILTIN_VENUES }}
    secrets:
      venueadd_read_token: ${{ secrets.VENUEADD_READ_TOKEN }}
      ANALYTICS_SSH_HOST: ${{ secrets.ANALYTICS_SSH_HOST }}
      ANALYTICS_SSH_PRIVATE_KEY: ${{ secrets.ANALYTICS_SSH_PRIVATE_KEY }}
      ANALYTICS_SSH_HOST_FINGERPRINT: ${{ secrets.ANALYTICS_SSH_HOST_FINGERPRINT }}
      ANALYTICS_API_SECRET: ${{ secrets.ANALYTICS_API_SECRET }}
      ANALYTICS_DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
      CADDY_SITE_ADDRESS: ${{ secrets.CADDY_SITE_ADDRESS }}
      KILL_SWITCH: ${{ secrets.KILL_SWITCH }}
      ANALYTICS_ARCUS_ADDRESS: ${{ secrets.ANALYTICS_ARCUS_ADDRESS }}
      ARCUS_ADDRESS: ${{ secrets.ARCUS_ADDRESS }}
      ARCUS_SIGNING_KEY: ${{ secrets.ARCUS_SIGNING_KEY }}
      ANALYTICS_MEXC_API_KEY: ${{ secrets.ANALYTICS_MEXC_API_KEY }}
      ANALYTICS_MEXC_API_SECRET: ${{ secrets.ANALYTICS_MEXC_API_SECRET }}
      ANALYTICS_MEXC_FUTURES_API_KEY: ${{ secrets.ANALYTICS_MEXC_FUTURES_API_KEY }}
      ANALYTICS_MEXC_FUTURES_API_SECRET: ${{ secrets.ANALYTICS_MEXC_FUTURES_API_SECRET }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      MEXC_FUTURES_API_KEY: ${{ secrets.MEXC_FUTURES_API_KEY }}
      MEXC_FUTURES_API_SECRET: ${{ secrets.MEXC_FUTURES_API_SECRET }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
